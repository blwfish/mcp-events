[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-events"
version = "0.1.0"
description = "Lightweight out-of-band event channel for MCP servers"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Brian Wong" },
]
keywords = ["mcp", "model-context-protocol", "events", "logging"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/blwfish/mcp-events"
"Bug Tracker" = "https://github.com/blwfish/mcp-events/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_events"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=2.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["--strict-markers", "--strict-config", "-ra", "--tb=short"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
